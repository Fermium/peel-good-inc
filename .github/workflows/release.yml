# Peel Good Inc. (repo: peelgood). Tag push (v1.2.3) -> universal build -> Developer ID sign -> notarize + staple app
# -> DMG (signed, notarized, stapled) + zip -> GitHub Release -> bump Homebrew tap.
# Manual runs (workflow_dispatch) build and upload artifacts only; no release, no tap bump.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"          # default on macos-26 images as of Oct 2026
  TAP_REPO: fermium/homebrew-tap   # <owner>/homebrew-tap

jobs:
  build:
    runs-on: macos-26              # arm64 (Apple silicon); builds a universal binary
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_sha256: ${{ steps.package.outputs.dmg_sha256 }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # CFBundleVersion must increase monotonically; the workflow run number does.
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/repositories
            .build/checkouts
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::warning::No signing secrets: building ad hoc, skipping notarization."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"      # no auto-lock for 6 h
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          # Developer ID G2 intermediate, in case the .p12 was exported without the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it first in the search list (keep the existing ones for the Apple intermediates).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build and sign Peel Good Inc.app
        run: scripts/release-build.sh      # reads VERSION, BUILD_NUMBER, SIGN_IDENTITY, KEYCHAIN

      - name: Write App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        if: steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "build/release/Peel Good Inc.app" "$RUNNER_TEMP/notarize-app.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "build/release/Peel Good Inc.app"

      - name: Package DMG and zip
        id: package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          dmg="dist/PeelGoodInc-${VERSION}.dmg"
          zip="dist/PeelGoodInc-${VERSION}.zip"
          scripts/make-dmg.sh "build/release/Peel Good Inc.app" "$dmg" "Peel Good Inc. ${VERSION}"
          if [[ "$SIGNED" == "true" ]]; then
            scripts/notarize.sh "$dmg"                      # staples the DMG in place
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
            spctl --assess --type execute -vv "build/release/Peel Good Inc.app"
          fi
          # Zip of the stapled app (what the cask could use instead of the DMG).
          ditto -c -k --sequesterRsrc --keepParent "build/release/Peel Good Inc.app" "$zip"
          (cd dist && shasum -a 256 -- *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dmg_sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: peel-good-inc-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Clean up keychain and key
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: peel-good-inc-${{ needs.build.outputs.version }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          # Unsigned (ad hoc) builds are normal releases for now; the Homebrew cask clears quarantine.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Peel Good Inc. ${{ needs.build.outputs.version }}"

  bump-tap:
    needs: [build, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_GITHUB_TOKEN }}   # fine-grained PAT: Contents read/write on the tap only
          path: tap
      - name: Update cask (and formula, if present)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DMG_SHA: ${{ needs.build.outputs.dmg_sha256 }}
        run: |
          cd tap
          cask=Casks/peel-good-inc.rb
          sed -E -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$cask"
          sed -E -i "s/^  sha256 \".*\"/  sha256 \"${DMG_SHA}\"/" "$cask"
          if [[ -f Formula/peelgood.rb ]]; then
            url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
            src_sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
            sed -E -i "s|^  url \".*\"|  url \"${url}\"|" Formula/peelgood.rb
            sed -E -i "s/^  sha256 \".*\"/  sha256 \"${src_sha}\"/" Formula/peelgood.rb
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "peel-good-inc ${VERSION}" || { echo "nothing to commit"; exit 0; }
          git push
